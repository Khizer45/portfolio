[project]
name = "portfolio-api"
version = "1.0.0"
description = "FastAPI backend for Khizer Hayat's portfolio"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = [
  "B008",  # FastAPI dependencies in defaults
  "S101",  # assert in tests
  "S105",  # test passwords
  "S106",
  "E501",  # long strings in seed data
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S", "N"]
"alembic/env.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
